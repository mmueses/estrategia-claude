name: Actualiza datos

# Descarga de Yahoo el S&P 500 y los tres fondos y recalcula datos/estado.json.
# - Automática: de lunes a viernes a las 21:47 UTC (después del cierre de Wall Street)
#   y de martes a sábado a las 05:17 UTC (por si la primera falla).
# - Manual: pestaña Actions > Actualiza datos > Run workflow (también desde el móvil).
#   Marcando 'Enviar un aviso de prueba' llega una notificación de prueba al móvil.
# Avisos al móvil: avisa.py los envía con ntfy al tema guardado en el secreto NTFY_TOPIC.
on:
  schedule:
    - cron: '47 21 * * 1-5'
    - cron: '17 5 * * 2-6'
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Enviar un aviso de prueba al móvil'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['descarga.py', 'evalua.py', '.github/workflows/actualiza.yml']

permissions:
  contents: write

concurrency:
  group: actualiza
  cancel-in-progress: false

jobs:
  actualiza:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Acciones fijadas por commit (no por etiqueta); Dependabot propone las nuevas cada mes.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - name: Descargar y evaluar
        id: bajar
        continue-on-error: true
        run: python3 descarga.py
      - name: Avisos al móvil (ntfy)
        id: avisos
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PRUEBA: ${{ inputs.prueba }}
        run: |
          if [ "$PRUEBA" = "true" ]; then python3 avisa.py datos --prueba; fi
          python3 avisa.py datos
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos
          git diff --cached --quiet || git commit -m "Datos $(date -u +'%F %H:%M')"
          # Por si alguien ha subido un cambio mientras corría la tarea
          git pull --rebase
          git push
      - name: Marcar en rojo si algún valor o algún aviso falló
        if: steps.bajar.outcome == 'failure' || steps.avisos.outcome == 'failure'
        run: exit 1
