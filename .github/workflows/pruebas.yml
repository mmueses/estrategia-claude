name: Pruebas

# Pruebas de la app (sin red) en cada cambio del código: python3 -m unittest discover -s pruebas
on:
  push:
    branches: [main]
    paths: ['*.py', 'pruebas/**', 'requirements.txt', '.github/workflows/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - run: python3 -m unittest discover -s pruebas -v
