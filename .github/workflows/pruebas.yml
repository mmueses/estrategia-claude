name: Pruebas

# Pruebas de la app (sin red) en cada cambio del código: python3 -m unittest discover -s pruebas
on:
  push:
    branches: [main]
    paths: ['*.py', 'pruebas/**', 'requirements.txt', '.github/workflows/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - run: python3 -m unittest discover -s pruebas -v
